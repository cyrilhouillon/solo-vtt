# Le client Vite (vtt-web) passe par son proxy /api : pas de CORS à ouvrir.
quarkus.http.port=8080
quarkus.http.test-port=0

# Les images de fond des cartes, une par empreinte. Les tests les gardent en mémoire.
solovtt.images.path=${user.home}/.solo-vtt/images
%test.solovtt.images.path=

# Les campagnes, une par dossier, chacune avec sa partie et ses cartes enregistrées. Les tests les gardent en mémoire.
solovtt.campaigns.path=${user.home}/.solo-vtt/campagnes
%test.solovtt.campaigns.path=

# Une battlemap haute définition dépasse vite les 10 Mo par défaut.
quarkus.http.limits.max-body-size=50M

# Le 404 d'une campagne inconnue, sur chaque route d'une partie.
mp.openapi.filter=solovtt.server.CampaignNotFoundFilter
