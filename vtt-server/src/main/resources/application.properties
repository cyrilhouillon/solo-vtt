# Le client Vite (vtt-web) passe par son proxy /api : pas de CORS à ouvrir.
quarkus.http.port=8080
quarkus.http.test-port=0

# La partie en cours, reprise au lancement. Les tests n'en gardent aucune : ils n'écrasent jamais celle du joueur.
solovtt.save.path=${user.home}/.solo-vtt/partie.json
%test.solovtt.save.path=

# Les images de fond des cartes, une par empreinte. Les tests les gardent en mémoire.
solovtt.images.path=${user.home}/.solo-vtt/images
%test.solovtt.images.path=

# Les cartes enregistrées, prêtes à charger. Les tests les gardent en mémoire.
solovtt.maps.path=${user.home}/.solo-vtt/cartes.json
%test.solovtt.maps.path=

# Une battlemap haute définition dépasse vite les 10 Mo par défaut.
quarkus.http.limits.max-body-size=50M
